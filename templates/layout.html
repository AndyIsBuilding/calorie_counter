<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon_default_light.png') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/icon_default_light.png') }}" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/icon_dark.png') }}" media="(prefers-color-scheme: dark)">
    <script>
        // iOS snapshots apple-touch-icon from the live DOM at "Add to Home Screen"
        // time and offers no media-query support for it, so swap in the dark
        // variant here when the device is in dark mode. Tinted/grayscale mode has
        // no web-exposed signal; iOS derives that look from the icon on its own.
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.querySelector('link[rel="apple-touch-icon"]').href =
                "{{ url_for('static', filename='icons/icon_dark.png') }}";
        }
    </script>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>{% block title %}AppStack{% endblock %}</title>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-100 min-h-screen">
    {% block navbar %}{% endblock %}

    <main class="container mx-auto mt-8 px-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast container -->
    <div id="toast-container" class="fixed bottom-0 right-0 p-4 z-50"></div>

    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register("{{ url_for('static', filename='js/service-worker.js') }}")
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
    <script>
        const COMMON_STATE = {
            flashMessages: {{ get_flashed_messages(with_categories=true)|tojson|safe }}
        };
    </script>
    <script src="{{ url_for('static', filename='js/common.js') }}?v={{ range(1, 10000) | random }}"></script>
</body>
</html>
